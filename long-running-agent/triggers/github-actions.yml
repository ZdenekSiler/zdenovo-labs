# .github/workflows/nightly-deps.yml
# The free hosted trigger. Three things to know:
#   * scheduled workflows are best-effort: "The schedule event can be delayed during periods of
#     high loads", and under enough load "some queued jobs may be dropped" (GitHub docs)
#   * in a PUBLIC repository they are disabled after 60 days without repository activity
#   * the runner is ephemeral, so the state store must live somewhere else (here: an artifact
#     restored and saved around the run; in production, a real database)
name: nightly-deps
on:
  schedule:
    - cron: "7 1 * * *"          # 01:07 UTC; avoid :00, when everyone's cron fires
  workflow_dispatch: {}          # the "run it now" button
concurrency:
  group: nightly-deps            # never two runs at once
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore state
        uses: dawidd6/action-download-artifact@v6
        with:
          name: lrlab-state
          if_no_artifact_found: warn
          path: state
      - name: Init (first run only)
        run: test -f state/deployment.json || python -m lrlab.cli init --home state --live-pypi
      - name: Tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pip install anthropic && python -m lrlab.cli fire --home state --model claude:claude-haiku-5-5
      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrlab-state
          path: state
          retention-days: 30
          overwrite: true
